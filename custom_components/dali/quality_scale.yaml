rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide custom actions or services.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide custom actions or services.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: This integration does not use authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: >-
      The only configurable setting is the USB device path, which USB discovery
      keeps up to date automatically.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: done
    comment: >-
      python-dali's DriverLubaRs232 is asyncio-native; the integration awaits
      connect/send directly with no executor offloading.
  inject-websession:
    status: exempt
    comment: This integration does not make HTTP requests.
  strict-typing:
    status: todo
    comment: >-
      The integration's own code is strictly typed, but the python-dali
      dependency does not yet ship a py.typed marker (PEP 561).
